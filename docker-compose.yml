version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledgex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://knowledgex_user:change-me@postgres:5432/knowledgex
      SECRET_KEY: knowledgex-production-secure-jwt-key-replace-in-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: knowledgex
      POSTGRES_USER: knowledgex_user
      POSTGRES_PASSWORD: change-me
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - backend_storage:/app/storage/documents
      - backend_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: knowledgex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgex
      POSTGRES_USER: knowledgex_user
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgex_user -d knowledgex"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledgex_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  backend_storage:
  backend_data:
  postgres_data:
  qdrant_data:
